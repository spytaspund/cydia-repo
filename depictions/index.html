<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Package</title>
    <meta name="viewport"
          content="initial-scale=1, maximum-scale=1, user-scalable=0">

    <link rel="stylesheet"
          href="https://raw.githack.com/hbang/iOS-7-CSS/refs/heads/master/ios7.min.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script src="https://raw.githack.com/hbang/iOS-7-CSS/refs/heads/master/ios7.min.js"></script>

    <script src="js/ios_version_check.js"></script>
    <script src="js/content-blocks-index.js"></script>

	<style>
		.compatibility-status {
			display: block;
			padding: 2px 0;
		}

		.status-lights {
			display: inline-block;
			white-space: nowrap;
			margin-right: 9px;
			vertical-align: middle;
		}

		.status-light {
			display: inline-block;
			width: 9px;
			height: 9px;
			border-radius: 50%;
			background: #c7c7cc;
			margin-right: 4px;
			vertical-align: middle;
		}

		.status-light:last-child {
			margin-right: 0;
		}

		.status-needs-upgrade .status-light:nth-child(1),
		.status-unsupported .status-light:nth-child(1) {
			background: #ff3b30;
		}

		.status-unconfirmed .status-light:nth-child(2) {
			background: #ffcc00;
		}

		.status-supported .status-light:nth-child(3) {
			background: #34c759;
		}	

		.compatibility-message {
			vertical-align: middle;
		}
	</style>
</head>
<body>

    <div id="packageError" style="display:none; padding:20px; text-align:center;">
        <p style="color:#ff3b30;">
            <strong>Oh snap!</strong>
            The package you are trying to view is not hosted on this repository.
        </p>
    </div>

    <div id="packageInformation">

        <header class="ios-header">
            <h1 id="packageName">Package</h1>
            <p id="packageShortDesc"
               style="font-size:13px;color:#8e8e93;margin:-5px 0 10px;text-align:center;"></p>
        </header>

        <main class="ios-table ios-main">

            <h2 role="header" id="compatibilityHeader">Compatibility</h2>
            <ul id="compatibilityList">
                <li>
                    <p id="compatibilityCheck"></p>
                </li>
            </ul>

            <h2 role="header" id="descriptionHeader">Description</h2>
            <ul id="descriptionList"></ul>

            <h2 role="header" id="versionHeader">
                In This Version
                <span id="versionBadge"
                      style="float:right;color:#8e8e93;font-weight:normal;"></span>
            </h2>
            <ul id="changesList"></ul>

            <h2 role="header" id="changelogHeader">Release History</h2>
            <ul id="changelogList">
                <li>
                    <a id="changelogLink" href="#" role="button">Full Changelog</a>
                </li>
            </ul>

            <h2 role="header" id="externalLinksHeader">Links</h2>
            <ul id="externalLinksList"></ul>

            <h2 role="header" id="contactHeader">Contact</h2>
            <ul id="repoFooterLinks"></ul>

        </main>
    </div>

    <script>
        $(function () {
            loadPackage();
        });
    </script>
</body>
</html>
