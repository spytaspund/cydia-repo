
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Release History</title>
    <meta name="viewport"
          content="initial-scale=1, maximum-scale=1, user-scalable=0">

    <link rel="stylesheet"
          href="https://raw.githack.com/hbang/iOS-7-CSS/refs/heads/master/ios7.min.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <script src="https://raw.githack.com/hbang/iOS-7-CSS/refs/heads/master/ios7.min.js"></script>

    <script src="js/content-blocks-changelog.js"></script>
</head>
<body>
    <div id="packageError"
         style="display:none;padding:20px;text-align:center;">
        <p style="color:#ff3b30;">
            <strong>Oh snap!</strong>
            The changelog could not be loaded.
        </p>
    </div>

    <div id="packageInformation">
        <header class="ios-header">
            <h1 id="packageName">Release History</h1>
            <p id="packageSubtitle"
               style="font-size:13px;color:#8e8e93;text-align:center;">
                All changes
            </p>
        </header>

        <main class="ios-table ios-main" id="changelogContent">
            <h2 role="header" id="historyHeader">Changes</h2>
            <ul id="historyList"></ul>
        </main>

        <div id="contactInfo">
            <main class="ios-table ios-main">
                <h2 role="header">Repository</h2>
                <ul id="repoFooterLinks"></ul>
            </main>
        </div>
    </div>

    <script>
        $(function () {
            loadChangelog();
        });
    </script>
</body>
</html>
